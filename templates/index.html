{% extends "base.html" %} {% block content %}

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-upload"></i> Upload Meeting Audio</h5>
      </div>

      <div class="card-body">
        <form method="post" action="/process" enctype="multipart/form-data">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Meeting Title</label>
              <input class="form-control" name="title" required />
            </div>

            <div class="col-md-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" name="date" required />
            </div>

            <div class="col-md-3">
              <label class="form-label">Time</label>
              <input class="form-control" name="time" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Platform</label>
              <select class="form-select" name="platform">
                <option>Google Meet</option>
                <option>Zoom</option>
                <option>MS Teams</option>
                <option>Offline</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Organizer</label>
              <input class="form-control" name="organizer" />
            </div>

            <div class="col-12">
              <label class="form-label">Meeting Audio (mp3 / wav)</label>
              <input type="file" class="form-control" name="audio" required />
            </div>
          </div>

          <div class="text-center mt-4">
            <button class="btn btn-success px-5">
              <i class="bi bi-gear-fill"></i> Generate Minutes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
